# Adicione estes dois blocos ao nginx-proxy (contexto http).
# kazari.lab já resolve pelo DNS *.lab para o IP Tailscale do homelab.
# O certificado precisa conter kazari.lab e sua CA precisa estar confiável no celular.

server {
    listen 80;
    server_name kazari.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kazari.lab;

    ssl_certificate     /etc/nginx/ssl/kazari.lab.crt;
    ssl_certificate_key /etc/nginx/ssl/kazari.lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $up http://kazari:3000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }
}

