# Origin local usado pelo Cloudflare Tunnel; TLS termina no Cloudflare.
# O container Kazari não publica portas próprias.
server {
    listen 80;
    server_name kazari.mockingbird.com.br;

    location / {
        set $up http://kazari:3000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }
}
