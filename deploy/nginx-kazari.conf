# Adicione estes dois blocos ao nginx-proxy (contexto http).
# kazari.mockingbird.com.br resolve para o IP Tailscale (100.93.88.105).
# O registro Cloudflare deve ficar DNS only; a aplicação não passa pelo Tunnel.
# A CA exclusiva do Kazari precisa estar confiável no celular.

server {
    listen 80;
    server_name kazari.mockingbird.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kazari.mockingbird.com.br;

    ssl_certificate     /etc/nginx/ssl/kazari-public/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kazari-public/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $up http://kazari:3000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }
}

